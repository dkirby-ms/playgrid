name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      postgres_admin_password:
        description: 'PostgreSQL admin password (required)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-infra
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Azure login via OIDC
        uses: azure/login@6c251865b4e6290e7b78be643ea2d005bc51f69a # v2.1.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep template
        run: |
          az bicep build --file infra/main.bicep
          echo "✓ Bicep syntax valid"

      - name: Run what-if deployment
        run: |
          POSTGRES_PASSWORD="${{ inputs.postgres_admin_password }}"
          if [ -z "$POSTGRES_PASSWORD" ]; then
            echo "No password provided, skipping what-if (requires password parameter)"
            exit 0
          fi

          DEPLOYMENT_ARGS=(
            --resource-group "${{ vars.RESOURCE_GROUP }}"
            --template-file infra/main.bicep
            --parameters postgresAdminPassword="$POSTGRES_PASSWORD"
          )

          az deployment group what-if "${DEPLOYMENT_ARGS[@]}"

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    environment: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Azure login via OIDC
        uses: azure/login@6c251865b4e6290e7b78be643ea2d005bc51f69a # v2.1.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate password input
        run: |
          POSTGRES_PASSWORD="${{ inputs.postgres_admin_password }}"
          if [ -z "$POSTGRES_PASSWORD" ]; then
            echo "❌ PostgreSQL password is required for infrastructure deployment"
            echo "Please provide postgres_admin_password input when triggering workflow"
            exit 1
          fi

      - name: Deploy infrastructure
        run: |
          DEPLOYMENT_ARGS=(
            --resource-group "${{ vars.RESOURCE_GROUP }}"
            --template-file infra/main.bicep
            --parameters postgresAdminPassword="${{ inputs.postgres_admin_password }}"
            --output json
          )

          az deployment group create "${DEPLOYMENT_ARGS[@]}" > deployment-output.json
          
          echo "✓ Infrastructure deployed successfully"

      - name: Display outputs
        run: |
          echo "📋 Deployment Outputs:"
          echo "====================="
          cat deployment-output.json | jq -r '.properties.outputs | to_entries[] | "\(.key): \(.value.value)"'

      - name: Save outputs for GitHub Actions
        run: |
          echo "🔑 Configure these as GitHub Actions variables for the 'prod' environment:"
          echo ""
          echo "CONTAINER_APP_NAME=$(cat deployment-output.json | jq -r '.properties.outputs.containerAppName.value')"
          echo "CONTAINER_APP_ENVIRONMENT_NAME=$(cat deployment-output.json | jq -r '.properties.outputs.containerAppEnvironmentName.value')"
          echo "CONTAINER_APP_ENVIRONMENT_ID=$(cat deployment-output.json | jq -r '.properties.outputs.containerAppEnvironmentId.value')"
          echo "CONTAINER_APP_FQDN=$(cat deployment-output.json | jq -r '.properties.outputs.containerAppFqdn.value')"
          echo "POSTGRES_SERVER_FQDN=$(cat deployment-output.json | jq -r '.properties.outputs.postgresServerFqdn.value')"
          echo "RESOURCE_GROUP=${{ vars.RESOURCE_GROUP }}"
          echo ""
          echo "💡 To set these variables, go to:"
          echo "   Settings → Environments → prod → Environment variables"
          echo ""
          echo "🔐 Also set the SERVER_DATABASE_URL environment secret:"
          echo "   postgresql://<admin user>:<password>@<POSTGRES_SERVER_FQDN>:5432/<database>?sslmode=require"
