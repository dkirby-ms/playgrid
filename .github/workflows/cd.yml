name: CD

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build And Push Image
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main'
      ) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve Release Version Tag
        id: version
        run: |
          set -euo pipefail
          tag="$(git tag --points-at HEAD --list 'v*' --sort=-v:refname | head -n 1 || true)"
          echo "semver_tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.semver_tag }},enable=${{ steps.version.outputs.semver_tag != '' }}

      - name: Build And Push Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min,ignore-error=true

  deploy:
    name: Deploy To Azure Container Apps
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Azure Login
        uses: azure/login@93381592711f247e165c389ebb30b596c84cdc48
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure GHCR Pull Credentials
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PASSWORD: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          if [[ -z "${GHCR_USERNAME}" || -z "${GHCR_PASSWORD}" ]]; then
            echo "No GHCR pull credentials configured; assuming the package is public."
            exit 0
          fi
          az containerapp registry set \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --server ghcr.io \
            --username "${GHCR_USERNAME}" \
            --password "${GHCR_PASSWORD}"

      - name: Configure Container App Secrets
        run: |
          KEY_VAULT_URI="${{ vars.KEY_VAULT_URI }}"
          KEY_VAULT_URI="${KEY_VAULT_URI%/}"
          az containerapp secret set \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --secrets "postgres-connection-string=keyvaultref:${KEY_VAULT_URI}/secrets/postgres-connection-string,identityref:system"

      - name: Deploy Container App
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --image "${IMAGE}" \
            --command "node" --args "server/dist/src/index.js" \
            --set-env-vars "NODE_ENV=production" "PORT=2567" "DATABASE_URL=secretref:postgres-connection-string" "DISABLED_GAMES=${{ vars.DISABLED_GAMES }}"

      - name: Health Check
        run: |
          HEALTH_URL="${{ vars.CONTAINER_APP_FQDN }}/health"
          for attempt in $(seq 1 12); do
            if curl -fs "$HEALTH_URL" | grep -q '"status":"ok"'; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt ${attempt}/12 failed, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed" >&2
          exit 1
